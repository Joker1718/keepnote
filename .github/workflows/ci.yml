name: CI - Syntax & Import Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system GTK3 (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gir1.2-gtk-3.0 \
            python3-gi python3-cairo libgtk-3-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install PyGObject pycairo

      - name: Check Python syntax
        run: |
          python3 -c "
          import ast, os, sys
          errors = []
          count = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git','dist','build','__pycache__')]
              for f in files:
                  if f.endswith('.py'):
                      count += 1
                      path = os.path.join(root, f)
                      try:
                          with open(path, 'r', encoding='utf-8', errors='replace') as fh:
                              ast.parse(fh.read())
                      except SyntaxError as e:
                          errors.append('%s: %s' % (path, e))
          print('Checked %d Python files' % count)
          if errors:
              print('\nSyntax errors:')
              for e in errors:
                  print('  ' + e)
              sys.exit(1)
          else:
              print('All files pass syntax check!')
          "

      - name: Test core module imports
        run: |
          python3 -c "
          import sys
          modules = [
              'keepnote',
              'keepnote.cache',
              'keepnote.safefile',
              'keepnote.plist',
              'keepnote.timestamp',
              'keepnote.util',
              'keepnote.extension',
              'keepnote.trans',
              'keepnote.commands',
              'keepnote.orderdict',
              'keepnote.maskdict',
              'keepnote.undo',
              'keepnote.listening',
              'keepnote.sqlitedict',
              'keepnote.xdg',
              'keepnote.notebook',
          ]
          failed = []
          for mod in modules:
              try:
                  __import__(mod)
                  print('  OK: ' + mod)
              except Exception as e:
                  failed.append((mod, str(e)))
                  print('  FAIL: %s - %s' % (mod, e))
          if failed:
              print('\n%d module(s) failed to import' % len(failed))
              sys.exit(1)
          else:
              print('\nAll %d modules imported successfully!' % len(modules))
          "
