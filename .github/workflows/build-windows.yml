name: Build KeepNote for Windows

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version'
        required: false
        default: '3.12'
        type: choice
        options: ['3.10', '3.11', '3.12']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable long paths (Windows 11)
        shell: powershell
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Setup MSYS2 and install Python & GTK dev packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-python3
            mingw-w64-x86_64-python3-pip
            mingw-w64-x86_64-python3-setuptools
            mingw-w64-x86_64-python3-wheel
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-gobject-introspection
            mingw-w64-x86_64-python3-gobject
            mingw-w64-x86_64-python3-cairo
            mingw-w64-x86_64-libffi
            pkg-config

      - name: Install PyInstaller in MSYS2
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig"
          /mingw64/bin/python -m pip install --upgrade pip setuptools wheel
          /mingw64/bin/python -m pip install pyinstaller

      - name: Verify PyGObject installation
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          /mingw64/bin/python -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk; print('GTK', Gtk.get_major_version(), '.', Gtk.get_minor_version(), '.', Gtk.get_micro_version())"

      - name: Build with PyInstaller (MSYS2 python)
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          /mingw64/bin/python -m PyInstaller keepnote.spec --clean --noconfirm 2>&1

      - name: Locate GTK3 runtime
        shell: powershell
        run: |
          # MSYS2 mingw64 is the known GTK/DLL location
          $msysMingw = "C:\msys64\mingw64"
          $gtkBin = ""
          if (Test-Path "$msysMingw\bin\libgtk-3-0.dll") {
            $gtkBin = "$msysMingw\bin"
            echo "Found GTK at: $gtkBin"
          }
          if ($gtkBin -eq "") {
            echo "WARNING: GTK3 DLLs not found in MSYS2. PyInstaller bundle may be incomplete."
          }
          echo "GTK_BIN=$gtkBin" >> $env:GITHUB_ENV

      - name: Bundle GTK3 runtime with PyInstaller output
        shell: powershell
        run: |
          $distDir = "dist\KeepNote"
          $msysMingw = "C:\msys64\mingw64"
          
          echo "Bundling GTK3 runtime from MSYS2 mingw64..."
          
          # Copy GTK3 DLLs from MSYS2 mingw64/bin
          $gtkDlls = @(
            'libgtk-3-0.dll', 'libgdk-3-0.dll', 'libglib-2.0-0.dll',
            'libgobject-2.0-0.dll', 'libgio-2.0-0.dll', 'libgmodule-2.0-0.dll',
            'libatk-1.0-0.dll', 'libatk-bridge-2.0-0.dll', 'libcairo-2.dll',
            'libpango-1.0-0.dll', 'libpangocairo-1.0-0.dll', 'libpangoft2-1.0-0.dll',
            'libgdk_pixbuf-2.0-0.dll', 'libcairo-gobject-2.dll', 'libcairo-script-interpreter-2.dll',
            'libepoxy-0.dll', 'libfontconfig-1.dll', 'libfreetype-6.dll',
            'libharfbuzz-0.dll', 'libpng16-16.dll', 'libjpeg-62.dll',
            'libtiff-5.dll', 'libwebp-7.dll', 'librsvg-2-2.dll',
            'libxml2-2.dll', 'libjasper-4.dll', 'liblcms2-2.dll',
            'libintl-8.dll', 'libiconv-2.dll', 'libwinpthread-1.dll',
            'libpcre2-8-0.dll', 'libffi-8.dll', 'libzlib-1.dll',
            'libgraphene-1.0-0.dll', 'libjson-glib-1.0-0.dll'
          )
          
          $dllSrcDir = "$msysMingw\bin"
          foreach ($dll in $gtkDlls) {
            $src = Join-Path $dllSrcDir $dll
            if (Test-Path $src) {
              Copy-Item $src -Destination $distDir -Force
            }
          }
          
          # Copy GI typelibs from MSYS2
          $typelibSrc = "$msysMingw\lib\girepository-1.0"
          if (Test-Path $typelibSrc) {
            New-Item -ItemType Directory -Path "$distDir\lib\girepository-1.0" -Force | Out-Null
            Copy-Item "$typelibSrc\*" -Destination "$distDir\lib\girepository-1.0" -Recurse -Force -ErrorAction SilentlyContinue
          }
          
          # Copy etc configs (GTK, Pango, Fonts) from MSYS2
          @('gtk-3.0', 'pango', 'fonts') | ForEach-Object {
            $src = "$msysMingw\etc\$_"
            if (Test-Path $src) {
              New-Item -ItemType Directory -Path "$distDir\etc\$_" -Force | Out-Null
              Copy-Item "$src\*" -Destination "$distDir\etc\$_" -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          
          # Copy share data (icons, themes, schemas) from MSYS2
          @('icons', 'themes', 'glib-2.0') | ForEach-Object {
            $src = "$msysMingw\share\$_"
            if (Test-Path $src) {
              New-Item -ItemType Directory -Path "$distDir\share\$_" -Force | Out-Null
              Copy-Item "$src\*" -Destination "$distDir\share\$_" -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          
          # Copy gdk-pixbuf loaders from MSYS2
          $loadersSrc = "$msysMingw\lib\gdk-pixbuf-2.0\2.10.0\loaders"
          if (Test-Path $loadersSrc) {
            New-Item -ItemType Directory -Path "$distDir\lib\gdk-pixbuf-2.0\2.10.0\loaders" -Force | Out-Null
            Copy-Item "$loadersSrc\*" -Destination "$distDir\lib\gdk-pixbuf-2.0\2.10.0\loaders" -Force
            $cacheSrc = "$msysMingw\lib\gdk-pixbuf-2.0\2.10.0\loaders.cache"
            if (Test-Path $cacheSrc) {
              Copy-Item $cacheSrc -Destination "$distDir\lib\gdk-pixbuf-2.0\2.10.0\" -Force
            }
          }
          
          echo "Bundle complete."
          echo "Files in dist:"
          (Get-ChildItem $distDir -File | Measure-Object).Count
          echo "DLLs:"
          (Get-ChildItem $distDir -Filter "*.dll" | Measure-Object).Count

      - name: Create ZIP artifact
        shell: powershell
        run: |
          $version = "0.7.9"
          $archiveName = "KeepNote-${version}-win11-py${{ matrix.python-version }}.zip"
          if (Test-Path "dist\KeepNote") {
            Compress-Archive -Path "dist\KeepNote\*" -DestinationPath $archiveName
            echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV
            echo "Created $archiveName"
          } else {
            echo "ERROR: dist/KeepNote not found!"
            Get-ChildItem "dist" -Recurse | Select-Object FullName
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepNote-Windows-py${{ matrix.python-version }}
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 30

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
