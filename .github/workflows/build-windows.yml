name: Build KeepNote for Windows

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version'
        required: false
        default: '3.12'
        type: choice
        options: ['3.11', '3.12']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Note: MSYS2 dropped older Python 3.10 support. Use current rolling variants.
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable long paths (Windows 11)
        shell: powershell
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Setup MSYS2 and install Python & GTK dev packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-gobject-introspection
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-pkgconf

      - name: Install PyInstaller in MSYS2
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig"
          python -m pip install --upgrade pip setuptools wheel --break-system-packages
          python -m pip install pyinstaller --break-system-packages

      - name: Verify PyGObject installation
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          python -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk; print('GTK', Gtk.get_major_version(), '.', Gtk.get_minor_version(), '.', Gtk.get_micro_version())"

      - name: Build with PyInstaller (MSYS2 python)
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          python -m PyInstaller keepnote.spec --clean --noconfirm 2>&1

      - name: Bundle GTK3 runtime with PyInstaller output
        shell: powershell
        run: |
          $distDir = "dist\KeepNote"
          $msysMingw = "C:\msys64\mingw64"
          
          if (-not (Test-Path "$distDir")) {
            echo "ERROR: dist/KeepNote not found! PyInstaller build likely failed."
            exit 1
          }

          echo "Bundling GTK3 assets and dependencies..."
          
          # Automated DLL tracking using ldd/dependency-walking is ideal, 
          # but here we safeguard your list by copying what exists.
          $dllSrcDir = "$msysMingw\bin"
          Get-ChildItem -Path $dllSrcDir -Filter "lib*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination $distDir -Force -ErrorAction SilentlyContinue
          }
          
          # Copy GI typelibs from MSYS2
          $typelibSrc = "$msysMingw\lib\girepository-1.0"
          if (Test-Path $typelibSrc) {
            New-Item -ItemType Directory -Path "$distDir\lib\girepository-1.0" -Force | Out-Null
            Copy-Item "$typelibSrc\*" -Destination "$distDir\lib\girepository-1.0" -Recurse -Force -ErrorAction SilentlyContinue
          }
          
          # Copy etc configs (GTK, Pango, Fonts) from MSYS2
          @('gtk-3.0', 'pango', 'fonts') | ForEach-Object {
            $src = "$msysMingw\etc\$_"
            if (Test-Path $src) {
              New-Item -ItemType Directory -Path "$distDir\etc\$_" -Force | Out-Null
              Copy-Item "$src\*" -Destination "$distDir\etc\$_" -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          
          # Copy share data (icons, themes, schemas) from MSYS2
          @('icons', 'themes', 'glib-2.0') | ForEach-Object {
            $src = "$msysMingw\share\$_"
            if (Test-Path $src) {
              New-Item -ItemType Directory -Path "$distDir\share\$_" -Force | Out-Null
              Copy-Item "$src\*" -Destination "$distDir\share\$_" -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          
          # Copy gdk-pixbuf loaders from MSYS2
          $loadersSrc = "$msysMingw\lib\gdk-pixbuf-2.0\2.10.0\loaders"
          if (Test-Path $loadersSrc) {
            New-Item -ItemType Directory -Path "$distDir\lib\gdk-pixbuf-2.0\2.10.0\loaders" -Force | Out-Null
            Copy-Item "$loadersSrc\*" -Destination "$distDir\lib\gdk-pixbuf-2.0\2.10.0\loaders" -Force
            $cacheSrc = "$msysMingw\lib\gdk-pixbuf-2.0\2.10.0\loaders.cache"
            if (Test-Path $cacheSrc) {
              Copy-Item $cacheSrc -Destination "$distDir\lib\gdk-pixbuf-2.0\2.10.0\" -Force
            }
          }
          
          echo "Bundle complete."

      - name: Create ZIP artifact
        shell: powershell
        run: |
          $version = "0.7.9"
          $archiveName = "KeepNote-${version}-win11-py${{ matrix.python-version }}.zip"
          if (Test-Path "dist\KeepNote") {
            Compress-Archive -Path "dist\KeepNote\*" -DestinationPath $archiveName
            echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV
            echo "Created $archiveName"
          } else {
            echo "ERROR: dist/KeepNote not found!"
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepNote-Windows-py${{ matrix.python-version }}
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 30

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
