[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keepnote"
version = "0.7.9"
description = "A cross-platform note taking application"
readme = "README.txt"
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.8"
dependencies = [
    "PyGObject>=3.40",
    "pycairo>=1.20",
]

[project.optional-dependencies]
spellcheck = ["pygobject-spell>=1.0"]
dev = ["pyinstaller>=5.0"]

[project.scripts]
keepnote = "keepnote:main"

[tool.setuptools.packages.find]
exclude = ["test*", "tests*"]

[tool.setuptools.package-data]
keepnote = ["rc/*", "images/*", "extensions/**/*"]
